name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Macs are aarch64-darwin; macos-latest runners are Apple Silicon.
          - host: macmini
            os: macos-latest
            target: darwinConfigurations.macmini.system
          - host: macbook
            os: macos-latest
            target: darwinConfigurations.macbook.system
          # rpi5 is aarch64-linux, so this needs an ARM runner — free for public
          # repos, paid for private ones. Note `nix flake check` ignores
          # `homeConfigurations` (not a standard flake output), so dropping this
          # entry means the Pi's config is not verified in CI at all.
          - host: rpi5
            os: ubuntu-24.04-arm
            target: homeConfigurations.rpi5.activationPackage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # Optional binary cache to speed up builds. FlakeHub Cache is the current
      # Determinate replacement for the retired magic-nix-cache; requires a
      # FlakeHub token/permissions. Uncomment to enable.
      # - uses: DeterminateSystems/flakehub-cache-action@main

      - name: Flake check (eval)
        run: nix flake check --no-build

      - name: Build ${{ matrix.host }}
        run: nix build --print-build-logs ".#${{ matrix.target }}"
